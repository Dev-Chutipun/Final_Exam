services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devpool
      POSTGRES_PASSWORD: devpool
      POSTGRES_DB: devpool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpool -d devpool"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devpool-net

volumes:
  pgdata:

networks:
  devpool-net:
    name: devpool-net
