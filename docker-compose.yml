services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devpool
      POSTGRES_PASSWORD: devpool
      POSTGRES_DB: devpool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpool -d devpool"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devpool-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      # บัญชี admin ของ Keycloak ใช้บนเครื่องเท่านั้น
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - devpool-net

volumes:
  pgdata:

networks:
  devpool-net:
    name: devpool-net
